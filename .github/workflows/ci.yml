name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Lint, Test, Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: letterboxd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d letterboxd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/letterboxd?schema=public
      NODE_ENV: test
      LOG_LEVEL: error
      CACHE_TTL: 60
      LETTERBOXD_TIMEOUT: 5000
      LETTERBOXD_PAGE_DELAY_MS: 0
      LETTERBOXD_MAX_PAGES: 1
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 1000
      CORS_ORIGIN: '*'
      PORT: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  deploy:
    name: Deploy (Vercel)
    needs: quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy placeholder
        run: |
          echo "Configure Vercel deployment with VERCEL_TOKEN / project link."
          echo "This job is intentionally gated until secrets are provided."
